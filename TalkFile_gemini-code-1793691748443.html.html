<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설월여고 디지털 현미경 사진전</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            /* 신비로운 현미경 바이오/우주 느낌의 그라데이션 배경 */
            background: linear-gradient(135deg, #1a0b2e 0%, #0f2027 50%, #203a43 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 배경 장식용 빛번짐 원 */
        .bg-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(138, 43, 226, 0.3);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: float 8s infinite alternate ease-in-out;
        }
        .bg-blob:nth-child(2) {
            background: rgba(0, 255, 204, 0.2);
            right: 10%;
            bottom: 10%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* 메인 컨테이너 (폰 목업 스타일) */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 880px;
            /* 물방울 유리 느낌 (Glassmorphism) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 상단 네비게이션 */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        header h1 {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(to right, #00ffcc, #bd00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-icons i {
            font-size: 20px;
            margin-left: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-icons i:hover {
            transform: scale(1.1);
            color: #00ffcc;
        }

        /* 피드 영역 (스크롤 가능) */
        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* 인스타 스타일 카드 */
        .post-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .post-header {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .profile-info .username {
            font-size: 13px;
            font-weight: 600;
        }

        .profile-info .location {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .post-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #000;
        }

        .post-actions {
            padding: 12px 15px 5px 15px;
            display: flex;
